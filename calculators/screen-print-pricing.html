<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Print Pricing Calculator | Northwest Custom Apparel</title>
    <meta name="description" content="Get instant screen print pricing on custom apparel. Professional calculator with automatic pricing, quantity discounts, setup fees, and multi-color printing options.">
    <meta name="keywords" content="screen print pricing, custom apparel calculator, t-shirt printing prices, bulk screen printing, screen print quotes">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.nwcustomapparel.com/calculators/screen-print-pricing.html">
    <meta property="og:title" content="Screen Print Pricing Calculator | Northwest Custom Apparel">
    <meta property="og:description" content="Calculate screen printing costs instantly. Get accurate quotes with quantity discounts, color options, and setup fees.">
    <meta property="og:image" content="https://cdn.caspio.com/A0E15000/Safety%20Stripes/web%20northwest%20custom%20apparel%20logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Screen Print Pricing Calculator | Northwest Custom Apparel">
    <meta name="twitter:description" content="Get instant screen printing quotes with our professional pricing calculator.">
    <meta name="twitter:image" content="https://cdn.caspio.com/A0E15000/Safety%20Stripes/web%20northwest%20custom%20apparel%20logo.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="/config/app.config.js"></script>
    <!-- Canonical tokens and controls; one shared structure and one method owner. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/shared_components/css/tokens.css?v=2026.09.08.2">
    <link rel="stylesheet" href="/shared_components/css/components.css?v=2026.09.11.3">
    <link rel="stylesheet" href="/shared_components/css/core-calculators.css?v=2026.09.11.5">
    <link rel="stylesheet" href="/calculators/css/screen-print-pricing.css?v=2026.09.11.5">
</head>
<body class="pricing-calculator-page" data-ui="unified" data-core-calculator="sp">

    <!-- ========================================
         UNIVERSAL PRICING CALCULATOR HEADER
         ======================================== -->
    <header class="enhanced-pricing-header">

        <!-- TIER 1: Contact Bar -->
        <div class="header-contact-bar">
            <div class="contact-bar-content">
                <div class="contact-info">
                    <div class="contact-item">
                        <i class="fas fa-phone" aria-hidden="true"></i>
                        <a href="tel:253-922-5793" class="contact-link">253-922-5793</a>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        <a href="mailto:sales@nwcustomapparel.com" class="contact-link">sales@nwcustomapparel.com</a>
                    </div>
                </div>
                <div class="business-hours">
                    <i class="fas fa-clock" aria-hidden="true"></i>
                    Monday - Friday: 8:30 AM - 5:00 PM PST
                </div>
            </div>
        </div>

        <!-- TIER 2: Logo/Navigation Bar -->
        <div class="header-nav">
            <div class="nav-content">
                <div class="logo-section">
                    <a href="/" class="logo-link">
                        <img src="https://cdn.caspio.com/A0E15000/Safety%20Stripes/web%20northwest%20custom%20apparel%20logo.png?ver=1"
                             alt="Northwest Custom Apparel"
                             class="logo-image">
                    </a>
                </div>
            </div>
        </div>

        <!-- TIER 3: Pricing Context Bar with Breadcrumb + Calculator Badge + Search -->
        <div class="pricing-context-bar">
            <div class="context-bar-content">
                <div class="context-left">
                    <!-- Breadcrumb Navigation -->
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <a href="/">Home</a>
                        <span class="breadcrumb-separator">/</span>
                        <a href="/product.html" id="products-breadcrumb">Products</a>
                        <span class="breadcrumb-separator">/</span>
                        <span class="breadcrumb-current">Screen Print Pricing</span>
                    </nav>

                    <!-- Calculator Type Badge -->
                    <div class="calculator-type-badge">
                        <i class="fas fa-print" aria-hidden="true"></i>
                        <span class="badge-text">Screen Print Pricing Calculator</span>
                    </div>
                </div>

                <!-- Product Search -->
                <div class="search-wrapper">
                    <input
                        type="text"
                        class="search-input"
                        id="styleSearch"
                        placeholder="Search by style number or name..."
                        autocomplete="off"
                        aria-label="Search for product by style number or name"
                        aria-describedby="search-results-live"
                        role="combobox"
                        aria-expanded="false"
                        aria-controls="searchResults"
                    >
                    <button class="search-btn" id="searchBtn" aria-label="Search for products">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </button>

                    <!-- Search Results Dropdown -->
                    <div class="search-results"
                         id="searchResults"
                         role="listbox"
                         aria-label="Product search results">
                        <!-- Results populated by JavaScript -->
                    </div>

                    <!-- Live region for screen readers -->
                    <div id="search-results-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
                </div>
            </div>
        </div>

    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Product Hero Section (DTG-Style Two-Column Layout) -->
        <div class="product-hero-section">
            <div class="product-content">
                <!-- Product Image Section (Left Column) -->
                <div class="product-image-section">
                    <div class="image-gallery" id="imageGallery">
                        <div class="main-image-container">
                            <img id="productImage" class="product-image" alt="" hidden>
                            <div id="imagePlaceholder" class="image-placeholder">
                                <i class="fas fa-tshirt sp-placeholder-icon" aria-hidden="true"></i>
                                <div>Product Image</div>
                            </div>
                        </div>
                        <div class="image-thumbnails" id="imageThumbnails" hidden>
                            <!-- Thumbnails will be added dynamically -->
                        </div>
                    </div>
                </div>

                <!-- Product Info Section (Right Column) -->
                <div class="product-info-section">
                    <h1 class="product-title" id="productTitle">Loading...</h1>
                    <p class="product-description" id="productDescription">Loading product information...</p>

                    <div class="product-details">
                        <div class="product-detail-item">
                            <i class="fas fa-palette" aria-hidden="true"></i>
                            <span>Color: <span class="product-detail-value" id="currentColor">Natural</span></span>
                        </div>
                        <div class="product-detail-item">
                            <i class="fas fa-tag" aria-hidden="true"></i>
                            <span>Style: <span class="product-detail-value" id="currentStyle">#PC54</span></span>
                        </div>
                        <div class="product-detail-item">
                            <i class="fas fa-building" aria-hidden="true"></i>
                            <span>Brand: <span class="product-detail-value" id="currentBrand">Port & Company</span></span>
                        </div>
                    </div>

                    <!-- Color Swatches -->
                    <div class="color-swatches-section" id="colorSwatchesSection" hidden>
                        <div class="color-swatches-title">Available Colors</div>
                        <div class="color-swatches" id="colorSwatches"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pricing Calculator Section (Full Width Below) -->
        <div class="pricing-calculator-section">
            <!-- Hidden Caspio Container -->
            <div id="caspio-iframe-container" hidden>
                <!-- Caspio iframe loads here -->
            </div>

            <!-- Screen Print Calculator V2 -->
            <div id="screenprint-calculator-v2">
                <!-- Calculator UI will be inserted here by JS -->
            </div>

        </div>

        <!-- Warehouse Inventory (collapsible) -->
        <div id="calculator-inventory-section" class="calc-inventory-section"></div>
    </main>

    <!-- Core Scripts (must load first) -->
    <script src="/shared_components/js/utils.js?v=2026.09.07.33"></script>
    
    <!-- Initialize product display when ready -->
    <script src="/calculators/js/screen-print-pricing-product.js?v=2026.09.11.5"></script>
    
    <!-- Shared Pricing Scripts (handles product data fetching) -->
    <script src="/shared_components/js/pricing-pages.js?v=2026.09.06.19"></script>
    <script src="/shared_components/js/pricing-matrix-api.js?v=2026.09.06.46"></script>
    <script src="/shared_components/js/product-pricing-ui.js?v=2026.09.07.33"></script>
    <script src="/shared_components/js/pricing-calculator.js?v=2026.09.07.33"></script>
    <script src="/shared_components/js/dtg-page-setup.js?v=2026.09.06.19"></script>
    <script src="/shared_components/js/dp5-helper.js?v=2026.09.06.46"></script>

    <!-- Universal Components -->
    <script src="/shared_components/js/universal-header-component.js?v=2026.09.06.19"></script>
    <!-- NOTE: Not using universal-product-display.js - we have custom HTML/JS for DTG-style layout -->
    <script src="/shared_components/js/universal-image-gallery.js?v=2026.09.06.19"></script>

    <!-- Screen Print V2 Scripts -->
    <script src="/shared_components/js/screenprint-pricing-service.js?v=2026.09.06.44"></script>
    <script src="/shared_components/js/manual-mode-indicator.js?v=2026.09.06.19"></script>
    <!-- Using original v2 with ALL functionality -->
    <script src="/shared_components/js/screenprint-pricing-v2.js?v=2026.09.12.1"></script>
    
    <!-- API Testing Utilities -->
    <script src="/calculators/js/screen-print-pricing-page.js?v=2026.09.06.19"></script>
<script src="/shared_components/js/calculator-inventory.js?v=2026.09.06.40"></script>
<script src="/shared_components/js/core-calculator-ui.js?v=2026.09.11.5"></script>
</body>
</html>
