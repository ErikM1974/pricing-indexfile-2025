<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Product - Northwest Custom Apparel</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/pages/css/customer-portal.css?v=2026.09.05.22">
    <link rel="stylesheet" href="/pages/css/customer-product.css?v=2026.09.05.23">
    <link rel="stylesheet" href="/pages/css/portal-reorder-list.css?v=2026.09.05.23">
</head>
<body>
    <header class="cp-header">
        <img src="https://cdn.caspio.com/A0E15000/Safety%20Stripes/web%20northwest%20custom%20apparel%20logo.png?ver=1"
             alt="Northwest Custom Apparel" class="cp-header-logo">
        <div class="cp-header-text">
            <div class="cp-header-brand">Northwest Custom Apparel</div>
            <p>Customer portal</p>
        </div>
        <div class="cp-header-actions">
            <a class="cp-header-link" id="pp-back-top" href="/portal">&larr; <span class="pp-back-long">Back to your account</span><span class="pp-back-short">Account</span></a>
        </div>
    </header>

    <div class="cp-loading" id="pp-loading">
        <div class="cp-spinner"></div>
        <div class="cp-loading-text">Loading product&hellip;</div>
    </div>

    <div class="cp-error" id="pp-error" hidden role="alert">
        <div class="cp-error-icon">&#9888;</div>
        <div class="cp-error-title" id="pp-error-title">Something went wrong</div>
        <div class="cp-error-message" id="pp-error-message">Please try again or contact us at (253) 922-5793.</div>
        <button type="button" class="cp-btn cp-btn--primary cp-btn--sm pp-error-retry" id="pp-error-retry" hidden>Retry</button>
    </div>

    <main class="cp-main" id="pp-content" hidden>
        <a class="pp-back" id="pp-back" href="/portal">&larr; Back to your account</a>
        <div id="pp-body"></div>
    </main>

    <div class="cp-toast" id="cp-toast"></div>

    <div class="cp-footer">
        Northwest Custom Apparel &middot; (253) 922-5793 &middot; sales@nwcustomapparel.com
    </div>

    <!-- Pricing engine (identical chain to Quick Quote) for the embroidery-upgrade price matrix — Rule 9 -->
    <script src="/config/app.config.js?v=2026.09.03.11"></script>
    <script src="/shared_components/js/decoration-methods.js?v=2026.07.01.1"></script>
    <script src="/shared_components/js/embroidery-pricing-service.js?v=2026.08.15.1"></script>
    <script src="/shared_components/js/cap-embroidery-pricing-service.js?v=2026.07.01.1"></script>
    <script src="/shared_components/js/embroidery-quote-pricing.js?v=2026.08.17.2"></script>
    <script src="/shared_components/js/quote-cart-engine.js?v=2026.07.07.7"></script>
    <script src="/pages/js/portal-reorder-list.js?v=2026.09.05.23"></script>
    <script src="/pages/js/customer-product.js?v=2026.09.05.23"></script>
</body>
</html>
