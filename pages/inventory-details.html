<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Details - Northwest Custom Apparel</title>
    <link rel="stylesheet" href="/product/styles/product.css?v=2026.09.06.26">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/pages/css/inventory-details.css?v=2026.09.05.77">
</head>
<body>
    <!-- Enhanced Header -->
    <header class="enhanced-inventory-header">
        <!-- Contact Bar -->
        <div class="header-contact-bar">
            <div class="contact-bar-content">
                <div class="contact-info">
                    <div class="contact-item">
                        <i class="fas fa-phone" aria-hidden="true"></i>
                        <span>(253) 922-5793</span>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        <span>sales@nwcustomapparel.com</span>
                    </div>
                </div>
                <div class="business-hours">
                    <i class="fas fa-clock" aria-hidden="true"></i>
                    Monday - Friday: 8:30 AM - 5:00 PM PST
                </div>
            </div>
        </div>
        
        <!-- Main Navigation -->
        <div class="header-nav">
            <div class="nav-content">
                <div class="logo-section">
                    <a href="/" class="logo-link">
                        <img src="https://cdn.caspio.com/A0E15000/Safety%20Stripes/web%20northwest%20custom%20apparel%20logo.png?ver=1" 
                             alt="Northwest Custom Apparel" 
                             class="logo-image">
                    </a>
                </div>
                
                <nav class="main-nav-links">
                    <a href="/">Home</a>
                    <a href="/product.html">Products</a>
                    <a href="mailto:sales@nwcustomapparel.com">Contact</a>
                </nav>
            </div>
        </div>
        
        <!-- Context Bar -->
        <div class="inventory-context-bar">
            <div class="context-bar-content">
                <div class="context-left">
                    <!-- Navigation Buttons -->
                    <div class="nav-buttons">
                        <a href="#" id="back-to-product" class="btn-back">
                            <i class="fas fa-arrow-left" aria-hidden="true"></i>
                            Back to Product
                        </a>
                        
                        <div class="pricing-dropdown">
                            <button type="button" class="btn-pricing" aria-haspopup="true" aria-expanded="false" aria-controls="pricing-dropdown-menu">
                                <i class="fas fa-calculator" aria-hidden="true"></i>
                                View Pricing
                                <i class="fas fa-chevron-down" aria-hidden="true"></i>
                            </button>
                            <div id="pricing-dropdown-menu" class="dropdown-menu">
                                <a href="#" class="dropdown-item" data-pricing="embroidery">
                                    <i class="fas fa-sewing-needle" aria-hidden="true"></i> Embroidery
                                </a>
                                <a href="#" class="dropdown-item" data-pricing="screen-print">
                                    <i class="fas fa-print" aria-hidden="true"></i> Screen Print
                                </a>
                                <a href="#" class="dropdown-item" data-pricing="dtg">
                                    <i class="fas fa-tshirt" aria-hidden="true"></i> DTG
                                </a>
                                <a href="#" class="dropdown-item" data-pricing="dtf">
                                    <i class="fas fa-film" aria-hidden="true"></i> DTF
                                </a>
                                <a href="#" class="dropdown-item" data-pricing="cap-embroidery">
                                    <i class="fas fa-hat-baseball" aria-hidden="true"></i> Cap Embroidery
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Breadcrumb -->
                    <div class="breadcrumb">
                        <i class="fas fa-warehouse" aria-hidden="true"></i>
                        <span>Inventory:</span>
                        <h1 id="header-product-name" class="breadcrumb-title">Loading...</h1>
                    </div>
                </div>
                
                <!-- Search Box -->
                <div class="header-search">
                    <i class="fas fa-search header-search-icon" aria-hidden="true"></i>
                    <input type="text" 
                           id="header-style-search" 
                           class="header-search-input" 
                           placeholder="Search another style..."
                           autocomplete="off">
                    <div id="header-search-results" class="header-search-results hidden"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="inventory-page-content">
        <!-- Color Selector -->
        <aside class="color-selector">
            <div class="color-list">
                <!-- Product Image -->
                <div class="product-image-container">
                    <img id="sidebar-product-image" src="" alt="Product" class="product-image">
                </div>
                
                <h3>Select Color:</h3>
                <div id="color-options">
                    <!-- Color options will be populated by JavaScript -->
                </div>
            </div>
        </aside>

        <!-- Inventory Display -->
        <main class="inventory-main">
            <section class="inventory-section inventory-section--rel">
                <button type="button" class="print-btn">
                    <i class="fas fa-print" aria-hidden="true"></i>
                    Print
                </button>
                <div id="inventory-display" class="inventory-container">
                    <!-- Inventory table will be populated by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script type="module" src="/pages/js/inventory-details.js?v=2026.09.05.79"></script>
</body>
</html>
