<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Invoice — Northwest Custom Apparel</title>
  <link rel="stylesheet" href="/shared_components/css/tokens.css?v=2026.09.08.2">
  <link rel="stylesheet" href="/shared_components/css/components.css?v=2026.09.10.8">
  <link rel="stylesheet" href="/shared_components/css/customer-documents.css?v=2026.09.10.8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body data-ui="unified" data-customer-document="portal-invoice">
  <a class="skip-link" href="#ci-main">Skip to invoice</a>
  <header class="document-header">
    <div><p class="document-eyebrow">Northwest Custom Apparel</p><h1 class="document-title">Invoice</h1></div>
  <div class="document-actions ci-toolbar" id="ci-toolbar">
    <a href="/portal" class="page-nav-link ci-back">&larr; Back to portal</a>
    <button id="ci-download" class="btn btn-primary ci-btn" type="button" disabled>Download PDF</button>
  </div>
  </header>
  <main class="document-main" id="ci-main" tabindex="-1">
  <p class="document-error" id="ci-download-error" role="alert" hidden></p>
  <div class="ci-status" id="ci-loading" role="status">Loading invoice&hellip;</div>
  <div class="ci-status" id="ci-error" role="alert" hidden>Couldn't load this invoice. <a href="/portal">Back to portal</a>. <button class="btn" id="ci-retry" type="button">Try again</button></div>
  <div class="ci-paper" id="ci-paper" hidden></div>
  </main>
  <script src="/pages/js/customer-invoice.js?v=2026.09.10.8"></script>
</body>
</html>
