# CI pipeline (roadmap 0.6). Deterministic jobs gate merges; the
# live-integration capture job is diagnostic (external Caspio dependency —
# never let a vendor outage block a release; the /deploy skill runs the
# capture with a real server as its own pre-flight gate).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    name: Unit tests + pricing parity + guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build pipeline (hashed assets + manifest)
        run: npm run build
      - name: Unit suite (includes web-quote-cart-parity, quick-quote-parity, no-hardcoded-hosts)
        run: npm run test:unit
      - name: DOM suite (roadmap 1.14 — adapter contracts, nudge-tier sync, DTF child rows)
        run: npm run test:dom
      - name: A11y ratchet (roadmap 1.9 — axe violations only drop vs tests/a11y/baseline.json)
        run: npm run test:a11y
      - name: Production dependency audit (clean baseline)
        run: npm audit --omit=dev
      - name: Full dependency audit (presentation-tool findings remain in dev only)
        run: npm audit --audit-level=high || echo "::warning::Development dependency audit findings — see log"

  e2e:
    name: Playwright E2E (money path + rendered axe ratchet)
    runs-on: ubuntu-latest
    # 2026-08-18: `playwright install --with-deps` hung here for 31+ minutes with
    # `npm run test:e2e` never starting. The job default is SIX HOURS, so the stall
    # burned a runner and blocked a PR on a check that had not run a single test.
    # This bounds it: a hung setup now fails in minutes and is obviously a re-run,
    # not a mystery. The job itself takes ~2.5 min warm.
    timeout-minutes: 20
    # 2026-09-08: the money-path and calculator-parity specs price through the LIVE proxy, whose reads have
    # required the proxy secret since the quote-plane lockdown — without it every run failed with "engine
    # error" (red from 2026-09-07 15:54). The rendered axe ratchet needs no secret and always runs; the two
    # live-engine specs run only when the secret is configured in this repository's Actions secrets
    # (Settings → Secrets → CRM_API_SECRET) and are reported as skipped otherwise. The /deploy pre-flight
    # runs all of them locally with the real secret, so a skip here never means "untested".
    env:
      CRM_API_SECRET: ${{ secrets.CRM_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      # Key on the RESOLVED version in node_modules, never the ^range in
      # package.json — a minor bump must invalidate the cache, or the run boots a
      # stale browser against a newer client and fails in ways nobody can read.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Chromium + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # Cache hit still needs the apt step: only ~/.cache/ms-playwright is cached,
      # and Chromium's system libraries live outside it. So this removes the
      # ~170MB browser download, NOT the apt round trip — `timeout-minutes` above
      # is what actually bounds an apt stall.
      - name: Install OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Boots server.js on :3400 (stripe/emailjs init lazily); all WRITES are route-mocked in the specs.
      - name: Rendered axe ratchet (no secret needed)
        run: npx playwright test --config tests/e2e/playwright.config.js a11y
      - name: Unified CSS and staff relay browser checks (mocked services)
        run: npx playwright test --config tests/e2e/playwright.config.js css-unification transfer-auth
      - name: Money path + calculator parity (live engine — needs CRM_API_SECRET)
        if: ${{ env.CRM_API_SECRET != '' }}
        run: npx playwright test --config tests/e2e/playwright.config.js money-path calculator-parity
      - name: Money path + calculator parity skipped (no CRM_API_SECRET in Actions secrets)
        if: ${{ env.CRM_API_SECRET == '' }}
        run: echo "::warning::CRM_API_SECRET is not set for this repository — the live-engine specs did not run here; the /deploy pre-flight runs them locally"

  lint:
    name: ESLint (strict new-code scope + legacy warning cap) and stylelint (token-system scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      # CSS standardization (2026-09-07): scripts/lint-css.js CSS_LINT_SCOPE is the ratchet; also runs under test:unit
      - run: npm run lint:css

  typecheck:
    name: tsc checkJs (builders scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
