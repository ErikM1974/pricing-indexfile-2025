<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Names &amp; Numbers Dashboard - NWCA</title>
    <link rel="icon" href="/favicon.png" type="image/png">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">



    <script src="/config/app.config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap"><link rel="stylesheet" href="/shared_components/css/tokens.css?v=2026.09.09.21"><link rel="stylesheet" href="/shared_components/css/components.css?v=2026.09.09.21"><link rel="stylesheet" href="/shared_components/css/personalization-workspaces.css?v=2026.09.09.21"></head>
<body data-ui="unified" data-personalization="names-numbers-dashboard"><a class="skip-link" href="#personalization-main">Skip to content</a>
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <img src="https://cdn.caspio.com/A0E15000/Safety%20Stripes/web%20northwest%20custom%20apparel%20logo.png?ver=1" alt="NWCA" class="logo">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="/staff-dashboard.html">Staff Dashboard</a>
                    <span>/</span>
                    <span>Names &amp; Numbers Dashboard</span>
                </nav>
            </div>
            <div class="header-right">
                <a href="/pages/names-numbers.html" class="btn-primary btn"><i class="fas fa-plus" aria-hidden="true"></i> New Roster</a>
                <a href="/staff-dashboard.html" class="btn-secondary btn"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back</a>
            </div>
        </div>
    </header>

    <main class="main-container" id="personalization-main" tabindex="-1">
        <div class="page-header">
            <div>
                <h1 class="page-title"><i class="fas fa-users" aria-hidden="true"></i> Names &amp; Numbers Dashboard</h1>
                <p class="page-subtitle">Manage all team rosters</p>
            </div>
        </div>

        <!-- KPIs -->
        <!-- KPI tiles are status filters (synced with the Status select; click the active one to clear) -->
        <div class="kpi-row" id="kpiRow" role="group" aria-label="Rosters by status">
            <button type="button" class="kpi-card kpi-btn" data-status="" aria-pressed="true"><div class="kpi-value" id="kpiTotal">-</div><div class="kpi-label">Total Rosters</div></button>
            <button type="button" class="kpi-card kpi-btn" data-status="Draft" aria-pressed="false"><div class="kpi-value" id="kpiDraft">-</div><div class="kpi-label">Draft</div></button>
            <button type="button" class="kpi-card kpi-btn" data-status="Submitted" aria-pressed="false"><div class="kpi-value" id="kpiSubmitted">-</div><div class="kpi-label">Submitted</div></button>
            <button type="button" class="kpi-card kpi-btn" data-status="In Production" aria-pressed="false"><div class="kpi-value" id="kpiInProd">-</div><div class="kpi-label">In Production</div></button>
            <button type="button" class="kpi-card kpi-btn" data-status="Completed" aria-pressed="false"><div class="kpi-value" id="kpiCompleted">-</div><div class="kpi-label">Completed</div></button>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
            <div class="form-group">
                <label for="filterSearch">Search</label>
                <input type="search" id="filterSearch" autocomplete="off" placeholder="Roster name or company..." class="field-input">
            </div>
            <div class="form-group">
                <label for="filterStatus">Status</label>
                <select id="filterStatus" class="field-select">
                    <option value="">All</option>
                    <option value="Draft">Draft</option>
                    <option value="Submitted">Submitted</option>
                    <option value="In Production">In Production</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div class="form-group">
                <label for="filterRep">Sales Rep</label>
                <input type="text" id="filterRep" autocomplete="off" placeholder="Rep name..." class="field-input">
            </div>
            <button type="button" class="btn-primary btn" id="filterBtn"><i class="fas fa-search" aria-hidden="true"></i> Filter</button>
            <button type="button" class="btn-secondary btn" id="clearFilterBtn">Clear</button>
            <span class="nn-result-count" id="nnResultCount" role="status"></span>
        </div>

        <!-- Results Table -->
        <div class="card">
            <div class="roster-table-wrapper table-wrap" tabindex="0" role="region" aria-label="Names and numbers rosters table">
                <table class="dashboard-table data-table">
                    <thead>
                        <tr>
                            <th>Roster Name</th>
                            <th>Company</th>
                            <th>Order #</th>
                            <th>People</th>
                            <th>Sales Rep</th>
                            <th>Status</th>
                            <th>Modified</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="dashboardBody">
                        <tr><td colspan="8" class="nn-table-msg" role="status">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/shared_components/js/names-numbers-service.js?v=2026.09.06.31"></script>
    <script src="/shared_components/js/caspio-date-utils.js?v=2026.09.06.46"></script>
    <script src="/shared_components/js/data-call-delegator.js?v=2026.09.06.27"></script>
    <script src="/shared_components/js/names-numbers-dashboard.js?v=2026.09.09.21"></script>


</body></html>
