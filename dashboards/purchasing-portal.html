<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Purchasing Portal - Northwest Custom Apparel</title>
    <link rel="icon" href="/favicon.png" type="image/png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 2026 design tokens (must load before dash-shell.css) -->
    <link rel="stylesheet" href="/shared_components/css/art-hub.css">
    <link rel="stylesheet" href="/shared_components/css/dash-shell.css">
    <link rel="stylesheet" href="/shared_components/css/sanmar-invoice-viewer.css?v=2026.07.19.17">
    <link rel="stylesheet" href="/dashboards/css/purchasing-portal.css?v=2026.09.03.13">
</head>
<body>
    <div class="dash-shell">
        <header class="dash-header">
            <div class="dash-header-left">
                <a href="/staff-dashboard.html" title="Back to Staff Dashboard">
                    <img src="https://cdn.caspio.com/A0E15000/Safety%20Stripes/web%20northwest%20custom%20apparel%20logo.png?ver=1"
                         alt="Northwest Custom Apparel" class="dash-header-logo">
                </a>
                <h1 class="dash-header-title">Purchasing Portal</h1>
            </div>
            <div class="dash-header-right">
                <a href="https://www.jotform.com/inbox/241646601815152" target="_blank" rel="noopener" class="dash-btn" title="The JotForm inbox Bradley works from">
                    <i class="fas fa-inbox"></i>
                    Form inbox
                </a>
                <button type="button" id="pp-refresh" class="dash-btn" title="Reload the feed">
                    <i class="fas fa-rotate"></i>
                    Refresh
                </button>
                <a href="/staff-dashboard.html" class="dash-back-link">
                    <i class="fas fa-arrow-left"></i>
                    Dashboard
                </a>
            </div>
        </header>

        <main class="dash-content">
            <div class="dash-error-banner" role="alert">
                <i class="fas fa-exclamation-triangle"></i>
                <span class="dash-error-banner-message"></span>
                <button class="dash-error-banner-close" aria-label="Dismiss">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Stat tiles are BUTTONS (2026-09-05): clicking one filters the table to that
                 status; the accent tile clears the filter. The turnaround tile is computed
                 from the rows (request → PO median, same-day share). -->
            <div class="dash-stat-grid pp-tiles">
                <button type="button" class="dash-stat-card dash-stat-card--accent pp-tile" data-filter="" title="Show every request in the window">
                    <div class="dash-stat-value" id="pp-stat-total">—</div>
                    <div class="dash-stat-label">Requests (60d)</div>
                    <div class="pp-stat-sub" id="pp-stat-total-sub"></div>
                </button>
                <button type="button" class="dash-stat-card pp-tile" data-filter="sent" title="Show requests Bradley has not ordered yet">
                    <div class="dash-stat-value" id="pp-stat-sent">—</div>
                    <div class="dash-stat-label">Awaiting Purchase</div>
                    <div class="pp-stat-sub" id="pp-stat-sent-sub"></div>
                </button>
                <button type="button" class="dash-stat-card pp-tile" data-filter="ordered" title="Show ordered requests (partially received listed separately below)">
                    <div class="dash-stat-value" id="pp-stat-ordered">—</div>
                    <div class="dash-stat-label">Ordered</div>
                    <div class="pp-stat-sub" id="pp-stat-ordered-sub"></div>
                </button>
                <button type="button" class="dash-stat-card pp-tile" data-filter="received" title="Show requests whose blanks are all in">
                    <div class="dash-stat-value" id="pp-stat-received">—</div>
                    <div class="dash-stat-label">Received</div>
                    <div class="pp-stat-sub" id="pp-stat-received-sub"></div>
                </button>
                <button type="button" class="dash-stat-card pp-tile" data-filter="done" title="Show finished requests (invoiced or shipped)">
                    <div class="dash-stat-value" id="pp-stat-done">—</div>
                    <div class="dash-stat-label">Invoiced / Shipped</div>
                    <div class="pp-stat-sub" id="pp-stat-done-sub"></div>
                </button>
                <div class="dash-stat-card pp-tile pp-tile--kpi">
                    <div class="dash-stat-value" id="pp-stat-turnaround">—</div>
                    <div class="dash-stat-label">Request &rarr; PO, median</div>
                    <div class="pp-stat-sub" id="pp-stat-turnaround-sub"></div>
                </div>
            </div>

            <div class="dash-card">
                <div class="dash-card-header pp-toolbar">
                    <h2 class="dash-card-title"><i class="fas fa-cart-flatbed"></i> Purchase Requests to Bradley</h2>
                    <span class="pp-updated" id="pp-updated"></span>
                </div>
                <div class="pp-filters">
                    <input type="search" id="pp-search" class="pp-input" placeholder="Search WO #, company, PO #, vendor…" aria-label="Search">
                    <select id="pp-filter-rep" class="pp-input" aria-label="Filter by requester">
                        <option value="">All requesters</option>
                    </select>
                    <select id="pp-filter-status" class="pp-input" aria-label="Filter by status">
                        <option value="">All statuses</option>
                        <option value="sent">Sent to Bradley</option>
                        <option value="ordered">Ordered</option>
                        <option value="partial">Partially received</option>
                        <option value="received">Received</option>
                        <option value="invoiced">Invoiced</option>
                        <option value="shipped">Shipped</option>
                    </select>
                    <!-- Open work by default (2026-09-05): 161 of 261 rows were finished, on one
                         12,000px page. Finished = invoiced or shipped. -->
                    <label class="pp-toggle" for="pp-show-finished">
                        <input type="checkbox" id="pp-show-finished">
                        <span>Show finished <span class="pp-toggle-n" id="pp-finished-n"></span></span>
                    </label>
                    <span class="pp-shown" id="pp-shown" role="status"></span>
                </div>
                <!-- Filled when the feed says it dropped requests (payload.truncated) — the
                     tile counted 275 while the table held 250 and nothing said so. -->
                <div class="pp-trunc" id="pp-trunc" hidden role="alert"></div>
                <div class="pp-table-scroll">
                    <table class="pp-table">
                        <thead>
                            <tr>
                                <th>WO #</th>
                                <th>Company</th>
                                <th class="pp-col-phone-hide">Requested by</th>
                                <th>Sent</th>
                                <th class="pp-col-phone-hide">Type</th>
                                <th>PO #</th>
                                <th>Vendors</th>
                                <th class="pp-col-phone-hide">Ordered</th>
                                <th class="pp-col-phone-hide">Received</th>
                                <th>Status</th>
                                <th>Request · Invoice</th>
                            </tr>
                        </thead>
                        <tbody id="pp-tbody">
                            <tr><td colspan="11" class="pp-empty dash-loading">Loading purchase requests…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Load order matters: APP_CONFIG → fetch-timeout → DashPage → shared invoice viewer → page controller -->
    <script src="/config/app.config.js"></script>
    <script src="/shared_components/js/fetch-timeout.js"></script>
    <script src="/shared_components/js/dash-page-helpers.js"></script>
    <script src="/shared_components/js/sanmar-invoice-viewer.js?v=2026.07.19.17"></script>
    <script src="/dashboards/js/purchasing-portal.js?v=2026.07.19.17"></script>
</body>
</html>
