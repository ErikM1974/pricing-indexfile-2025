<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Old Designs Archive - Northwest Custom Apparel</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="stylesheet" href="/shared_components/css/tokens.css?v=2026.09.07.20">
    <link rel="stylesheet" href="/shared_components/css/old-designs.css?v=2026.09.07.19">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="minimal-header">
        <img src="https://cdn.caspio.com/A0E15000/Safety%20Stripes/web%20northwest%20custom%20apparel%20logo.png?ver=1" alt="Northwest Custom Apparel" class="logo">
        <a href="/staff-dashboard.html" class="back-link">Back to Dashboard</a>
    </div>

    <main class="content-container">
        <h1 class="page-title">Old Designs Archive</h1>
        <span class="page-subtitle">Search archived designs from Megafile directories</span>
        <div class="caspio-container">
            <script type="text/javascript" src="https://c3eku948.caspio.com/dp/a0e150006e417291bd264106a505/emb"></script>
        </div>
    </main>

    <div class="image-modal-overlay" id="image-modal" role="dialog" aria-modal="true" aria-label="Design preview, full size" tabindex="-1">
        <button type="button" class="modal-nav modal-prev" aria-label="Previous image"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
        <img alt="Design preview">
        <button type="button" class="modal-nav modal-next" aria-label="Next image"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        <span class="modal-counter" role="status"></span>
        <button type="button" class="image-modal-close" id="image-modal-close" aria-label="Close preview">&times;</button>
    </div>

    <div class="sticky-search-bar" id="sticky-search-bar"></div>
    <div id="toast-container" role="status" aria-live="polite"></div>

    <script src="/shared_components/js/data-call-delegator.js?v=2026.09.06.27"></script>
    <script src="/shared_components/js/old-designs.js?v=2026.09.05.59"></script>
</body>
</html>
