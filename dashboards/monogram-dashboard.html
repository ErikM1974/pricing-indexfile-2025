<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Monogram Dashboard - Northwest Custom Apparel</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/dashboards/css/monogram-dashboard.css?v=2026.09.05.57">
    <script src="/config/app.config.js"></script>
</head>
<body>
    <!-- Fixed Header -->
    <header class="dashboard-header">
        <!-- Contact Bar -->
        <div class="header-contact-bar">
            <div class="contact-bar-content">
                <div class="contact-info">
                    <span class="contact-item"><i class="fas fa-phone" aria-hidden="true"></i> 253-922-5793</span>
                    <span class="contact-item"><i class="fas fa-envelope" aria-hidden="true"></i> sales@nwcustomapparel.com</span>
                </div>
                <div class="contact-info">
                    <span class="contact-item"><i class="fas fa-clock" aria-hidden="true"></i> Mon-Fri 8am-5pm PST</span>
                </div>
            </div>
        </div>

        <!-- Navigation Bar -->
        <nav class="header-nav">
            <div class="nav-content">
                <a href="/">
                    <img src="https://cdn.caspio.com/A0E15000/Safety%20Stripes/web%20northwest%20custom%20apparel%20logo.png?ver=1"
                         alt="Northwest Custom Apparel" class="logo-image">
                </a>
                <div class="main-nav-links">
                    <a href="/staff-dashboard.html"><i class="fas fa-th-large" aria-hidden="true"></i> Dashboard</a>
                    <a href="/quote-builders/monogram-form.html"><i class="fas fa-font" aria-hidden="true"></i> New Monogram</a>
                </div>
            </div>
        </nav>

        <!-- Context Bar -->
        <div class="context-bar">
            <div class="context-bar-content">
                <div class="context-left">
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <a href="/staff-dashboard.html" aria-label="Staff Dashboard"><i class="fas fa-home" aria-hidden="true"></i></a>
                        <i class="fas fa-chevron-right breadcrumb-sep" aria-hidden="true"></i>
                        <span>Monogram Dashboard</span>
                    </nav>
                    <h1 class="page-title">Monogram Orders</h1>
                </div>
                <div class="quick-actions">
                    <a href="/quote-builders/monogram-form.html" class="quick-btn quick-btn-primary">
                        <i class="fas fa-plus" aria-hidden="true"></i> New Monogram
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Dashboard Card -->
        <div class="dashboard-card">
            <div class="card-header">
                <h2><i class="fas fa-font" aria-hidden="true"></i> Monogram Orders</h2>
                <button type="button" class="btn btn-outline" data-call="loadMonograms">
                    <i class="fas fa-sync-alt" aria-hidden="true"></i> Refresh
                </button>
            </div>

            <!-- Filters -->
            <div class="filters-section">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="searchInput">Search</label>
                        <input type="search" id="searchInput" class="filter-input" autocomplete="off"
                               placeholder="Order # or company name...">
                    </div>
                    <div class="filter-group">
                        <label for="salesRepFilter">Sales Rep</label>
                        <select id="salesRepFilter" class="filter-input filter-select">
                            <option value="">All Reps</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="statusFilter">Status</label>
                        <select id="statusFilter" class="filter-input filter-select">
                            <option value="">All Statuses</option>
                            <option value="Submitted">Submitted</option>
                            <option value="Printed">Printed</option>
                            <option value="Complete">Complete</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="dateFrom">From Date</label>
                        <input type="date" id="dateFrom" class="filter-input">
                    </div>
                    <div class="filter-group">
                        <label for="dateTo">To Date</label>
                        <input type="date" id="dateTo" class="filter-input">
                    </div>
                    <div class="filter-group">
                        <button type="button" class="btn btn-primary" data-call="filterMonograms">
                            <i class="fas fa-search" aria-hidden="true"></i> Search
                        </button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table id="monogramsTable" aria-describedby="resultCount">
                    <thead>
                        <tr>
                            <th>Order #</th>
                            <th>Company</th>
                            <th>Sales Rep</th>
                            <th># of Names</th>
                            <th>Created</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="monogramsTableBody">
                        <tr>
                            <td colspan="7" class="loading">
                                <i class="fas fa-spinner" aria-hidden="true"></i> Loading monograms...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Footer -->
            <div class="table-footer">
                <span id="resultCount" role="status">Loading...</span>
            </div>
        </div>
    </main>

    <script src="/shared_components/js/data-call-delegator.js?v=2026.09.06.27"></script>
    <script src="/shared_components/js/monogram-dashboard.js?v=2026.09.06.31"></script>
</body>
</html>
