<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Access layout harness — staff dashboard v3</title>

<!--
  Pulls the REAL .zone-quick-access + Pride Wall markup out of
  staff-dashboard-v3/index.html at runtime, so this harness can never drift
  from production the way a hand-copied fixture would.

  It deliberately does NOT load the hidden Caspio auth DataPage that
  index.html embeds — that page redirects the whole tab to the Caspio login
  when you aren't signed in, which makes the live page impossible to inspect
  in a headless browser.

  Serve the repo root over http (any static server) and open this file.
-->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>@layer reset, tokens, base, components, utilities, overrides;</style>
<link rel="stylesheet" href="/shared_components/css/staff-dashboard/tokens.css">
<link rel="stylesheet" href="/shared_components/css/staff-dashboard/base.css">
<link rel="stylesheet" href="/shared_components/css/staff-dashboard/components.css">
<link rel="stylesheet" href="/shared_components/css/staff-dashboard/utilities.css">
<link rel="stylesheet" href="/shared_components/css/staff-dashboard/dashboard-v3-theme.css">
<link rel="stylesheet" href="/shared_components/css/staff-dashboard/dashboard-v3-patch-2.css">
<link rel="stylesheet" href="/shared_components/css/staff-dashboard/phase1-widgets.css">
<link rel="stylesheet" href="/tests/ui/test-quick-access-layout.css">
</head>
<body>

<div class="harness-bar">
    <strong>Quick Access layout harness</strong>
    <span id="widthReadout"></span>
    <button type="button" data-w="1920">1920</button>
    <button type="button" data-w="1440">1440</button>
    <button type="button" data-w="1280">1280</button>
    <button type="button" data-w="1024">1024</button>
    <button type="button" data-w="768">768</button>
    <button type="button" data-w="375">375</button>
    <button type="button" id="rerunBtn">Re-run checks</button>
</div>

<div id="results" class="harness-results">Loading production markup…</div>

<div class="harness-stage" id="stage">
    <div class="main-content" id="mount"></div>
</div>

<script type="module" src="/tests/ui/test-quick-access-layout.js"></script>
</body>
</html>
